<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f8b7d"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>مركز الشفاء</title>
<style>
:root{--bg:#f2f7f6;--cd:#fff;--tx:#12302c;--mu:#5f7a76;--pr:#0f8b7d;--p2:#0a6358;--bd:#d9e6e3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:560px;margin-inline:auto;min-height:100vh}
header{background:linear-gradient(135deg,var(--pr),var(--p2));color:#fff;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px}
header h1{font-size:20px;margin:0}header p{margin:2px 0 0;font-size:12px;opacity:.9}.g{flex:1}
nav{display:flex;gap:6px;padding:10px;overflow-x:auto}nav button{flex:none;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;font-size:14px}nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{padding:0 12px 40px}.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.r{display:flex;align-items:center;gap:10px}.m{color:var(--mu);font-size:13px}.t{display:inline-block;background:#d6efeb;color:#0a6358;border-radius:10px;padding:2px 8px;font-size:12px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;font:inherit;margin:4px 0;background:#fff;color:#12302c}
label{font-size:13px;color:var(--mu)}.b{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit}.b.l{background:rgba(255,255,255,.2)}
h2{font-size:16px;margin:14px 4px 4px}.e{color:#c0392b;font-size:13px}.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}.st div{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}.st b{display:block;font-size:24px;color:var(--pr)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:start}.x{overflow-x:auto}
</style></head><body>
<header><svg width="40" height="40" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#fff" opacity=".25"/><rect x="214" y="110" width="84" height="292" rx="20" fill="#fff"/><rect x="110" y="214" width="292" height="84" rx="20" fill="#fff"/></svg>
<div class="g"><h1>مركز الشفاء</h1><p dir="ltr" style="text-align:start">Mobile Applications · Developed by Karim Saudi</p></div><span id="hb"></span></header>
<nav id="nav"></nav><main id="v"></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,addDoc,onSnapshot,doc,getDoc,setDoc,updateDoc,query,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
// ====== ضع بيانات مشروع Firebase هنا ======
const cfg={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT",appId:"YOUR_APP_ID"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ITEMS=["بلاستر","رشاش","ميكروكروم","بيتادين","دريسنج","رباط ضاغط"];
const RN={admin:"Admin",receptionist:"Receptionist",doctor:"Doctor",pending:"قيد المراجعة"};
const S={user:null,role:null,tab:"home",data:{},msg:"",reg:false},subs={};
function listen(c,q){if(subs[c])return;subs[c]=onSnapshot(q||collection(db,c),s=>{S.data[c]=s.docs.map(d=>({id:d.id,...d.data()}));list()},()=>{})}
function unlisten(){for(const k of ["appointments","supplies","diagnoses","users"]){subs[k]&&subs[k]();delete subs[k]}}
const D=c=>S.data[c]||[];
const TABS={guest:[["home","الأطباء والحجز"]],login:[["login","دخول الموظفين"]],
admin:[["dash","اليوم"],["doctors","الأطباء"],["amb","الإسعاف"],["sup","المستلزمات"],["apps","الحجوزات"],["staff","الموظفون"]],
receptionist:[["sup","المستلزمات"],["apps","الحجوزات"]],doctor:[["dx","التشخيصات"]],pending:[["pend","قيد المراجعة"]]};
onAuthStateChanged(auth,async u=>{unlisten();S.user=u;S.role=null;
 if(u){const r=await getDoc(doc(db,"users",u.uid));S.role=r.exists()?r.data().role:"pending";
  if(!r.exists())await setDoc(doc(db,"users",u.uid),{email:u.email,role:"pending",at:serverTimestamp()});
  const R=S.role;if(R=="admin"){["appointments","supplies","diagnoses","users"].forEach(c=>listen(c))}
  if(R=="receptionist"){listen("appointments");listen("supplies")}
  if(R=="doctor"){listen("appointments");listen("diagnoses",query(collection(db,"diagnoses"),where("uid","==",u.uid)))}
  S.tab=TABS[R][0][0]}else S.tab="home";draw()});
listen("doctors");listen("ambulances");
const key=()=>S.user?S.role:(S.tab=="login"?"login":"guest");
function draw(){const k=key(),t=TABS[k];
 $("#hb").innerHTML=S.user?`<button class="b l" id="lo">خروج</button>`:(S.tab=="login"?`<button class="b l" id="bk">رجوع</button>`:`<button class="b l" id="li">دخول الموظفين</button>`);
 $("#lo")&&($("#lo").onclick=()=>signOut(auth));$("#li")&&($("#li").onclick=()=>{S.tab="login";S.msg="";draw()});$("#bk")&&($("#bk").onclick=()=>{S.tab="home";draw()});
 $("#nav").innerHTML=t.length>1?t.map(x=>`<button class="${S.tab==x[0]?"on":""}" data-t="${x[0]}">${x[1]}</button>`).join(""):"";
 $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;draw()});
 $("#v").innerHTML=FORM[S.tab]?FORM[S.tab]():"";$("#v").insertAdjacentHTML("beforeend",`<div id="L"></div>`);list()}
function list(){const L=$("#L");if(L&&LIST[S.tab])L.innerHTML=LIST[S.tab]()}
const fv=id=>$("#"+id).value.trim();
const doctorsHtml=()=>D("doctors").map(d=>`<div class="c"><b>${esc(d.name)}</b> <span class="t">${esc(d.specialty)}</span><div class="m">${esc(d.days)} · ${esc(d.hours)}</div></div>`).join("")||`<div class="c m">لا يوجد أطباء بعد</div>`;
const ambHtml=()=>D("ambulances").map(a=>`<div class="c r">🚑 <b>${esc(a.name)}</b><span class="m">${esc(a.status)}</span></div>`).join("");
const appsHtml=()=>`<h2>الحجوزات</h2>`+(D("appointments").slice().sort((a,b)=>(a.when>b.when?1:-1)).map(a=>`<div class="c"><b>${esc(a.name)}</b> · ${esc(a.phone)}<div class="m">${esc(a.doctor)} · ${esc(a.when)}</div></div>`).join("")||`<div class="c m">لا توجد حجوزات</div>`);
const supHtml=()=>{const s=D("supplies");return `<h2>سجل المستلزمات</h2><div class="c x"><table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${s.map(x=>`<tr><td>${esc(x.item)}</td><td>${x.qty}</td><td>${x.price}</td><td>${x.qty*x.price}</td></tr>`).join("")}</table></div>`};
const FORM={
home:()=>`<h2>أطباء المركز</h2>${doctorsHtml()}<h2>احجز موعد</h2><div class="c"><label>الاسم</label><input id="gn"><label>رقم الموبايل</label><input id="gp" type="tel" dir="ltr"><label>الدكتور</label><select id="gd">${D("doctors").map(d=>`<option>${esc(d.name)}</option>`).join("")}</select><label>الموعد</label><input id="gw" type="datetime-local"><button class="b" id="gb">تأكيد الحجز</button><div class="m" id="gm"></div></div><h2>الإسعاف</h2>${ambHtml()}`,
login:()=>`<div class="c"><h2>${S.reg?"حساب جديد":"تسجيل الدخول"}</h2><label>الإيميل (Gmail)</label><input id="le" type="email" dir="ltr"><label>الباسورد</label><input id="lp" type="password" dir="ltr"><button class="b" id="lb">${S.reg?"إنشاء حساب":"دخول"}</button> <button class="b l" style="color:#0a6358;background:#d6efeb" id="ls">${S.reg?"عندي حساب":"حساب جديد"}</button><div class="e" id="lm"></div></div>`,
dash:()=>`<h2>ملخص اليوم</h2><div class="st"><div><b id="n1">0</b>حجوزات</div><div><b id="n2">0</b>كشوفات</div><div><b id="n3">0</b>مستلزمات</div><div><b id="n4">0</b>مستلزمات (ج)</div></div>`,
doctors:()=>`<h2>إضافة دكتور</h2><div class="c"><label>الاسم</label><input id="dn"><label>التخصص</label><input id="ds"><label>الأيام</label><input id="dd"><label>الساعات</label><input id="dh"><button class="b" id="db">إضافة</button></div>`,
amb:()=>`<h2>إضافة سيارة إسعاف</h2><div class="c"><label>الاسم أو الرقم</label><input id="an"><label>الحالة</label><select id="as"><option>متاحة أمام المركز</option><option>في مهمة</option><option>في الصيانة</option></select><button class="b" id="ab">إضافة</button></div>`,
sup:()=>`<h2>تسجيل مستلزم</h2><div class="c"><label>الصنف</label><select id="si">${ITEMS.map(x=>`<option>${x}</option>`).join("")}</select><label>الكمية</label><input id="sq" type="number" min="1" value="1"><label>السعر (تحدده أنت)</label><input id="sp" type="number" min="0"><button class="b" id="sb">تسجيل</button></div>`,
dx:()=>`<h2>تشخيص جديد</h2><div class="c"><label>اسم المريض</label><input id="xp"><label>التشخيص</label><textarea id="xd" rows="2"></textarea><label>الإجراءات</label><textarea id="xi" rows="2"></textarea><label>الأدوية</label><textarea id="xm" rows="2"></textarea><button class="b" id="xb">حفظ</button></div>`,
pend:()=>`<div class="c">حسابك قيد المراجعة. سيحدد الأدمن صلاحيتك قريبًا.</div>`,apps:()=>"",staff:()=>""};
const LIST={
home:()=>{},doctors:()=>doctorsHtml(),amb:()=>ambHtml(),apps:appsHtml,sup:supHtml,
dash:()=>{const a=D("appointments").length,x=D("diagnoses").length,s=D("supplies");[a,x,s.length,s.reduce((t,i)=>t+i.qty*i.price,0)].forEach((v,i)=>{const e=$("#n"+(i+1));e&&(e.textContent=v)});return ""},
dx:()=>D("diagnoses").map(x=>`<div class="c"><b>${esc(x.patient)}</b><div>${esc(x.dx)}</div><div class="m">${esc(x.proc)} · ${esc(x.meds)}</div></div>`).join(""),
staff:()=>`<h2>الموظفون</h2>`+D("users").map(u=>`<div class="c r"><div class="g">${esc(u.email)}<div class="m">${RN[u.role]||u.role}</div></div><select data-u="${u.id}"><option value="">تغيير</option><option>admin</option><option>receptionist</option><option>doctor</option></select></div>`).join("")};
document.addEventListener("change",async e=>{const u=e.target.dataset?.u;if(u&&e.target.value)await updateDoc(doc(db,"users",u),{role:e.target.value})});
const add=(c,o)=>addDoc(collection(db,c),{...o,at:serverTimestamp()});
document.addEventListener("click",async e=>{const id=e.target.id;if(!id)return;
 try{
 if(id=="gb"){const o={name:fv("gn"),phone:fv("gp"),doctor:fv("gd"),when:fv("gw")};if(!o.name||!o.phone||!o.doctor||!o.when){$("#gm").textContent="أكمل كل البيانات";return}await add("appointments",o);$("#gm").textContent="تم الحجز ✅"}
 if(id=="ls"){S.reg=!S.reg;draw()}
 if(id=="lb"){const f=S.reg?createUserWithEmailAndPassword:signInWithEmailAndPassword;await f(auth,fv("le"),fv("lp"))}
 if(id=="db"&&fv("dn")){await add("doctors",{name:fv("dn"),specialty:fv("ds"),days:fv("dd"),hours:fv("dh")});draw()}
 if(id=="ab"&&fv("an")){await add("ambulances",{name:fv("an"),status:fv("as")});draw()}
 if(id=="sb"&&fv("sp")!==""){await add("supplies",{item:fv("si"),qty:+fv("sq")||1,price:+fv("sp"),by:S.user.email})}
 if(id=="xb"&&fv("xp")&&fv("xd")){await add("diagnoses",{uid:S.user.uid,patient:fv("xp"),dx:fv("xd"),proc:fv("xi"),meds:fv("xm")});draw()}
 }catch(err){const m=$("#lm")||$("#gm");if(m)m.textContent="تعذر التنفيذ: "+(err.code||err.message)}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
draw();
</script></body></html>
